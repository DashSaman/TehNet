<h3 id="compare-support-offers">برای دو شعبه، دو پیشنهاد را چگونه کنار هم بگذاریم؟</h3>
<p>فرض کنید هر دو شعبه و تجهیزات یکسان‌اند. نمونهٔ زیر پرسش‌های یک خریدار است. مبلغ و زمان پاسخ را از پیشنهاد کتبی همان مجری وارد کنید.</p>
<figure class="wp-block-table"><table><thead><tr><th>موضوع</th><th>پیشنهاد الف، حضور برنامه‌ریزی‌شده</th><th>پیشنهاد ب، حضور درخواستی</th></tr></thead><tbody>
<tr><td>دامنه و حضور</td><td>نام دو شعبه، اقلام و دفعات بازدید نوشته شود.</td><td>مشخص شود کدام کار ریموت است و چه کسی اعزام را تأیید می‌کند.</td></tr>
<tr><td>رفت‌وآمد و خارج ساعات</td><td>سقف رفت‌وآمد و استثنای شب یا تعطیل</td><td>هزینهٔ هر اعزام و مجوز کار خارج ساعات</td></tr>
<tr><td>پاسخ یا رفع</td><td>زمان پذیرش درخواست و شروع پیگیری جدا ثبت شود.</td><td>زمان بازگشت سرویس و کار آزموده‌شده جدا ثبت شود.</td></tr>
<tr><td>قطعه و نرم‌افزار ثالث</td><td>مسئول تأمین و مجوز خرید مشخص شود.</td><td>مسئول ارجاع به سازنده و پیگیری تا نتیجه معلوم باشد.</td></tr>
<tr><td>پایان کار</td><td>نمایندهٔ هر شعبه نتیجهٔ کاربر را تأیید کند.</td><td>مسئول و تاریخ پیگیری موارد باز در گزارش ماهانه بیاید.</td></tr></tbody></table></figure>
<p>برای تصمیم دربارهٔ پایش یا روتر یدکی، <a href="/small-office-monitoring-signals/">نشانه‌های خرابی در دفتر کوچک</a> و <a href="/office-spare-router-acceptance/">آزمون تحویل روتر یدکی</a> را ببینید.</p>
