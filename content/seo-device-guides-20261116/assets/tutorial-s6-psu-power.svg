<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار سه‌چک انتخاب PSU درس S6 با حکم مبنای ۱۲۰ وات</title>
<desc>انتخاب PSU سه چک دارد: اول ولتاژ که برای استاندارد af و at باید چهل‌وهشت ولت باشد چون netPower مبدل داخلی ندارد؛ دوم توان اسمی که باید حداقل صد و سی و شش وات باشد یعنی جمع تقاضا با حاشیه و مصرف خود سوئیچ و از برگهٔ رسمی همان PSU گرفته شود؛ سوم ورودی‌های مستقل که دو جک DC با سقف جریان هرکدام حدود شصت‌وهفت وات هستند و دو PSU مستقل بهتر از یک PSU واحد است. حکم مبنا: تک‌ورودی رد، دو ورودی مرزی، و PSU بزرگ‌تر مشروط به برگهٔ رسمی. فهرست PSUهای سازگار از صفحهٔ رسمی محصول آمده است. این نمودار مفهومی و تألیفی TehNet است.</desc>
<text x="480" y="36" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">انتخاب PSU — سه چک سندشده‌محور</text>
<rect x="120" y="80" width="720" height="66" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="200" y="106" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e88e5" font-weight="bold">چک ۱: ولتاژ</text>
<text x="560" y="100" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">af/at → 48V (netPower بدون مبدل داخلی: PSU 24V =</text>
<text x="560" y="116" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">خروجی 24V پسیو)</text>
<rect x="120" y="166" width="720" height="66" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
<text x="200" y="192" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#43a047" font-weight="bold">چک ۲: توان اسمی</text>
<text x="560" y="186" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">PSU ≥ demand×1.2 + مصرف سوئیچ (136W در این مبنا) —</text>
<text x="560" y="202" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">از برگهٔ رسمی PSU</text>
<rect x="120" y="252" width="720" height="66" rx="8" fill="#fafafa" stroke="#fb8c00" stroke-width="2"/>
<text x="200" y="278" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fb8c00" font-weight="bold">چک ۳: ورودی‌های مستقل</text>
<text x="560" y="272" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">دو جک DC = دو PSU مستقل؛ سقف هر ورودی ≈67W</text>
<rect x="120" y="350" width="720" height="90" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="480" y="374" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d32f2f" font-weight="bold">حکم برای demand ‏120W این مبنا (تفسیر محافظه‌کارانهٔ سقف‌ها):</text>
<text x="480" y="398" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">تک‌ورودی ≈67W → رد</text>
<text x="480" y="412" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">دو ورودی ≈134W → مرزی (کسری حاشیه) → کاهش demand یا SKU بالاتر</text>
<text x="480" y="426" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">PSU بزرگ‌تر: قبول مشروط به برگهٔ رسمی توان — UNKNOWN تا برگه</text>
<rect x="120" y="460" width="720" height="62" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
<text x="480" y="482" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32" font-weight="bold">PSUهای سازگار از صفحهٔ رسمی netPower 16P (فetch 2026-11-16):</text>
<text x="480" y="502" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#546e7a" font-weight="normal">24HPOW · MTP250-53V47-OD · MTP250-26V94-OD · 48POW · 48V2A96W — توان اسمی: از برگهٔ رسمی همان PSU (UNKNOWN تا برگه)</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — اجرا NOT_RUN</text>
</svg>
