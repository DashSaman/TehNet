<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار معماری تونل شعبه-مرکز درس M5 با دو گزینهٔ WireGuard و IPsec</title>
<desc>شعبه با روتر hEX و شبکهٔ ۱۹۲.۱۶۸.۲۰ و مرکز با RB5009 و شبکهٔ ۱۹۲.۱۶۸.۱۰ با یک تونل بین خودشان وصل شده‌اند. دو گزینهٔ سندشده روی تونل نمایش داده شده: WireGuard با کلید عمومی و خصوصی و allowed-address و keepalive، یا IPsec با peer و policy و proposal. پنج تلهٔ سندشده پایین نمودار آمده: فایروال پیش‌فرض جلوی WireGuard، شکستن تونل با masquerade در IPsec، گذر Fasttrack از روی policy، هشدار PSK و حساسیت زمانی. مسیرهای متقابل دو شبکه با خط‌چین بنفش رسم شده است. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="330" y="220" width="300" height="110" rx="8" fill="#e8eaf6" stroke="#1e88e5" stroke-width="3"/>
<text x="480" y="246" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">تونل site-to-site</text>
<rect x="345" y="258" width="270" height="30" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
<text x="480" y="278" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0d47a1" font-weight="normal">گزینهٔ ۱: WireGuard (کلید عمومی/خصوصی)</text>
<rect x="345" y="292" width="270" height="30" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1"/>
<text x="480" y="312" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1b5e20" font-weight="normal">گزینهٔ ۲: IPsec/IKEv2 (peer/policy/proposal)</text>
<rect x="700" y="150" width="220" height="130" rx="8" fill="#fafafa" stroke="#fb8c00" stroke-width="3"/>
<text x="810" y="176" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e65100" font-weight="bold">شعبه — hEX (فرضی)</text>
<text x="810" y="200" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">LAN: 192.168.20.0/24</text>
<text x="810" y="222" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">wg/ipsec peer + allowed-address</text>
<text x="810" y="244" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#78909c" font-weight="normal">keepalive 25s (سند WireGuard)</text>
<text x="810" y="264" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">endpoint = مرکز</text>
<rect x="40" y="150" width="220" height="130" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="3"/>
<text x="150" y="176" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">مرکز — RB5009 (فرضی)</text>
<text x="150" y="200" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">LAN: 192.168.10.0/24</text>
<text x="150" y="222" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">peer + allowed-address متقابل</text>
<text x="150" y="244" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">route متقابل دو سو</text>
<text x="150" y="264" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">فایروال: accept قبل از drop</text>
<line x1="260" y1="215" x2="330" y2="250" stroke="#1e88e5" stroke-width="3"/>
<line x1="330" y1="300" x2="260" y2="265" stroke="#43a047" stroke-width="3"/>
<line x1="630" y1="250" x2="700" y2="215" stroke="#1e88e5" stroke-width="3"/>
<line x1="630" y1="300" x2="700" y2="265" stroke="#43a047" stroke-width="3"/>
<text x="295" y="240" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">wg/ipsec</text>
<text x="665" y="240" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">wg/ipsec</text>
<line x1="150" y1="280" x2="150" y2="300" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="150" y1="300" x2="810" y2="300" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="810" y1="300" x2="810" y2="280" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="5,4"/>
<text x="480" y="292" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6a1b9a" font-weight="normal">مسیرهای متقابل: 192.168.20.0/24 ↔ 192.168.10.0/24</text>
<rect x="60" y="370" width="840" height="130" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="480" y="394" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">تله‌های سندشده (هر دو گزینه)</text>
<text x="90" y="418" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#616161" font-weight="normal">WireGuard: فایروال پیش‌فرض جلوی برقراری تونل → accept قبل از drop (سند رسمی)</text>
<text x="90" y="434" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#616161" font-weight="normal">IPsec: masquerade تونل را می‌شکند → accept/bypass بالای همهٔ NAT (سند رسمی)</text>
<text x="90" y="450" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#616161" font-weight="normal">IPsec: Fasttrack از روی policy می‌گذرد → accept قبل از Fasttrack یا raw notrack</text>
<text x="90" y="466" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#616161" font-weight="normal">هشدار رسمی: از PSK پرهیز؛ DH Group 19 پیشنهاد؛ IPsec حساس به تغییر زمان</text>
<text x="90" y="482" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#616161" font-weight="normal">wg-export شامل IP/route/firewall نیست — روی مقصد جدا تنظیم شود</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — دستورها از اسناد رسمی (دسترسی 2026-11-17)؛ اجرا NOT_RUN</text>
</svg>
