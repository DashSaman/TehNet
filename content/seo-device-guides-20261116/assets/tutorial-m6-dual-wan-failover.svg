<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار dual-WAN و failover درس M6 با دو WAN و میزبان‌های تست</title>
<desc>روتر hEX با دو خروجی اینترنت: WAN-A به عنوان primary با distance یک که میزبان تست هشت‌هشت‌هشت‌هشت از طریق آن مانیتور می‌شود و WAN-B به عنوان پشتیبان با distance دو و میزبان تست هشت‌هشت‌چهار‌چهار. مسیرهای میزبان با scope ده تعریف شده‌اند و مسیرهای default با target-scope یازده به‌طور recursive از طریق میزبان‌ها حل می‌شوند؛ بدون این مسیرها هر دو default غیرفعال می‌مانند. بعد از قطع WAN-A مسیر پشتیبان فعال می‌شود و اتصال‌های برقرار می‌شکنند که در چک‌لیست پذیرش ثبت شده است. این نمودار مفهومی و تألیفی TehNet است.</desc>
<text x="300" y="40" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">حالت عادی — primary</text>
<text x="660" y="40" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#e65100" font-weight="bold">بعد از قطع WAN-A — backup فعال</text>
<rect x="390" y="200" width="180" height="80" rx="8" fill="#fafafa" stroke="#0d47a1" stroke-width="3"/>
<text x="480" y="230" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">hEX (RB750Gr3)</text>
<text x="480" y="254" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">LAN: 192.168.88.0/24</text>
<rect x="60" y="130" width="180" height="64" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="3"/>
<text x="150" y="154" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="bold">WAN-A — ISP-A</text>
<text x="150" y="176" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">gateway فرضی 10.111.0.1 — distance 1</text>
<rect x="620" y="130" width="180" height="64" rx="8" fill="#fafafa" stroke="#78909c" stroke-width="3"/>
<text x="710" y="154" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#546e7a" font-weight="bold">WAN-B — ISP-B</text>
<text x="710" y="176" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">gateway فرضی 10.112.0.1 — distance 2</text>
<rect x="60" y="300" width="180" height="56" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
<text x="150" y="322" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="normal">میزبان تست: 8.8.8.8</text>
<text x="150" y="340" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#546e7a" font-weight="normal">scope=10 — check-gateway</text>
<rect x="620" y="300" width="180" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
<text x="710" y="322" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e65100" font-weight="normal">میزبان تست: 8.8.4.4</text>
<text x="710" y="340" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#546e7a" font-weight="normal">scope=10 — check-gateway</text>
<line x1="240" y1="162" x2="390" y2="220" stroke="#43a047" stroke-width="4"/>
<line x1="620" y1="162" x2="570" y2="220" stroke="#78909c" stroke-width="3" stroke-dasharray="8,6"/>
<line x1="150" y1="194" x2="150" y2="300" stroke="#43a047" stroke-width="2"/>
<line x1="710" y1="194" x2="710" y2="300" stroke="#78909c" stroke-width="2"/>
<text x="300" y="185" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32" font-weight="bold">primary — distance 1</text>
<text x="600" y="185" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">backup — distance 2</text>
<rect x="390" y="360" width="180" height="60" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="480" y="386" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">LAN کاربران</text>
<text x="480" y="406" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">192.168.88.0/24</text>
<line x1="480" y1="280" x2="480" y2="360" stroke="#37474f" stroke-width="3"/>
<rect x="60" y="440" width="840" height="56" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="480" y="462" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d32f2f" font-weight="bold">بعد از قطع WAN-A: مسیر primary از دسترس (check-gateway به 8.8.8.8) → مسیر backup فعال می‌شود</text>
<text x="480" y="482" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">اتصال‌های برقرار حین سوییچ شکسته می‌شوند (رفتار موردانتظار این الگو) — DNS cache هم flush شود</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — الگوی عیناً از سند رسمی Failover (دسترسی 2026-11-17)؛ اجرا NOT_RUN</text>
</svg>
