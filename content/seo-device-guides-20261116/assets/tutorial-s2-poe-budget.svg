<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار بودجهٔ PoE درس S2: از PSU جداگانه تا هر دستگاه</title>
<desc>PSU جداگانه با ولتاژ ۲۴ یا ۴۸ ولت به ورودی DC سوئیچ netPower 16P می‌رسد. سوئیچ حدود ۱۶ وات مصرف خودی دارد و سقف هر ورودی DC سندشده حدود ۶۷ وات است. خروجی PoE به هشت دوربین با جمع هشتاد وات، چهار تلفن با جمع بیست وات و پورت‌های آزاد رشد تقسیم می‌شود. جمع تقاضا صد وات و با حاشیهٔ امن دوازده صد وات است که باید از توان قابل تامین PSU منهای مصرف خود سوئیچ کمتر باشد. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="760" y="200" width="180" height="120" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
<text x="850" y="232" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e65100" font-weight="bold">PSU جداگانه (پیوست نیست)</text>
<text x="850" y="254" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#546e7a" font-weight="normal">24V یا 48V</text>
<text x="850" y="274" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">24V → PoE پسیو/ناسازگار af</text>
<text x="850" y="292" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">48V → af/at سندشده</text>
<rect x="430" y="180" width="260" height="160" rx="8" fill="#ffffff" stroke="#0d47a1" stroke-width="3"/>
<text x="560" y="208" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">netPower 16P (CRS318-16P-2S+OUT)</text>
<rect x="445" y="222" width="230" height="42" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
<text x="560" y="240" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">مصرف خود سوئیچ ≈ 16W</text>
<text x="560" y="258" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0d47a1" font-weight="normal">سقف هر ورودی DC: 24V→2.8A (≈67W)</text>
<text x="560" y="274" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0d47a1" font-weight="normal">                48V→1.4A (≈67W)</text>
<text x="560" y="322" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">16× GbE PoE-out (af/at) + 2× SFP+ uplink</text>
<line x1="760" y1="260" x2="690" y2="260" stroke="#f9a825" stroke-width="4"/>
<text x="725" y="250" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e65100" font-weight="bold">DC</text>
<rect x="60" y="216" width="260" height="44" rx="8" fill="#fafafa" stroke="#fb8c00" stroke-width="2"/>
<text x="190" y="244" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">۸ دوربین × 10W = 80W</text>
<rect x="60" y="336" width="260" height="44" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
<text x="190" y="364" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">۴ تلفن × 5W = 20W</text>
<rect x="60" y="446" width="260" height="44" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
<text x="190" y="474" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">پورت آزاد رشد (ether13-16)</text>
<line x1="430" y1="250" x2="320" y2="240" stroke="#fb8c00" stroke-width="3"/>
<line x1="430" y1="265" x2="320" y2="360" stroke="#43a047" stroke-width="3"/>
<line x1="430" y1="290" x2="320" y2="470" stroke="#9e9e9e" stroke-width="3" stroke-dasharray="6,4"/>
<text x="375" y="232" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e65100" font-weight="bold">PoE-out</text>
<rect x="60" y="30" width="300" height="70" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
<text x="210" y="56" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="bold">demand = 80W + 20W = 100W</text>
<text x="210" y="78" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="normal">با حاشیهٔ امن ×1.2 → 120W</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — اعداد از صفحهٔ رسمی netPower 16P (دسترسی 2026-11-16)</text>
</svg>
