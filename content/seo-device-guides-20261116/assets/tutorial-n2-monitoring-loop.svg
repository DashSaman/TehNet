<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660">
<title>نمودار حلقهٔ مانیتورینگ و نگهداری درس N2</title>
<desc>حلقهٔ چهارمرحله‌ای مانیتورینگ: متریک‌های پایه شامل دسترسی، منابع، دما، خطای پورت و فضای pool؛ آستانه‌های هشدار که پیشنهاد شروع هستند و با داده واقعی کالیبره می‌شوند؛ هشدار با Netwatch probe و ثبت در لاگ؛ و اقدام با چک‌لیست هفتگی ماهانه و فصلی همراه تست بازیابی. انتهای حلقه به متریک‌ها برمی‌گردد. شاخهٔ جدا نشان می‌دهد هشدار بدون اقدام بی‌اثر است. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="200" y="90" width="560" height="76" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="480" y="116" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e88e5" font-weight="bold">متریک‌ها</text>
<text x="480" y="142" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">دسترسی · منابع · دما · خطای پورت · pool</text>
<line x1="480" y1="166" x2="480" y2="208" stroke="#37474f" stroke-width="3"/>
<rect x="200" y="208" width="560" height="76" rx="8" fill="#fafafa" stroke="#6a1b9a" stroke-width="2"/>
<text x="480" y="234" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6a1b9a" font-weight="bold">آستانه‌ها</text>
<text x="480" y="260" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">پیشنهاد شروع — کالیبره با دادهٔ واقعی</text>
<line x1="480" y1="284" x2="480" y2="326" stroke="#37474f" stroke-width="3"/>
<rect x="200" y="326" width="560" height="76" rx="8" fill="#fafafa" stroke="#d32f2f" stroke-width="2"/>
<text x="480" y="352" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#d32f2f" font-weight="bold">هشدار</text>
<text x="480" y="378" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">Netwatch probe + لاگ TN-N2</text>
<line x1="480" y1="402" x2="480" y2="444" stroke="#37474f" stroke-width="3"/>
<rect x="200" y="444" width="560" height="76" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
<text x="480" y="470" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#43a047" font-weight="bold">اقدام و نگهداری</text>
<text x="480" y="496" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">چک‌لیست هفتگی/ماهانه/فصلی + تست بازیابی</text>
<line x1="760" y1="490" x2="830" y2="490" stroke="#43a047" stroke-width="3"/>
<line x1="830" y1="490" x2="830" y2="128" stroke="#43a047" stroke-width="3"/>
<line x1="830" y1="128" x2="760" y2="128" stroke="#43a047" stroke-width="3"/>
<text x="845" y="310" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="bold">بازبینی دوره‌ای</text>
<rect x="40" y="300" width="120" height="90" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="100" y="330" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d32f2f" font-weight="bold">هشدار بدون اقدام</text>
<text x="100" y="352" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d32f2f" font-weight="normal">= بی‌اثر</text>
<line x1="200" y1="428" x2="160" y2="390" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,4"/>
<text x="480" y="633" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — آستانه‌ها «پیشنهاد شروع»؛ اجرا NOT_RUN</text>
</svg>
