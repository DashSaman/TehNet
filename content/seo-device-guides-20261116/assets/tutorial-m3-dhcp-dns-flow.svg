<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>نمودار جریان DHCP و DNS درس M3 با مرز مورداعتماد</title>
<desc>کلاینت با Discover از سرور DHCP که به پل بسته شده آدرس می‌گیرد و در Offer شمارهٔ gateway و DNS یعنی 192.168.88.1 را دریافت می‌کند. سپس کلاینت نام nas.lan را روی پورت 53 از روتر می‌پرسد و روتر از cache یا بالادستی پاسخ می‌دهد. مرز خط‌چین قرمز نشان می‌دهد پورت 53 فقط از زیرشبکهٔ 192.168.88.0/24 پذیرفته می‌شود تا روتر open resolver نشود؛ کلاینت خاکستری با آدرس 10.9.9.9 بیرون مرز است و پرس‌وجویش timeout می‌گیرد. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="740" y="150" width="200" height="120" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="3"/>
<text x="840" y="180" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e88e5" font-weight="bold">کلاینت (DHCP گیرنده)</text>
<text x="840" y="205" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#546e7a" font-weight="normal">تست: ipconfig، nslookup</text>
<text x="840" y="225" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#546e7a" font-weight="normal">DHCP: gateway+DNS=192.168.88.1</text>
<text x="840" y="245" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9e9e9e" font-weight="normal">کلاینت غیرمورداعتماد: 10.9.9.9</text>
<rect x="360" y="120" width="260" height="200" rx="8" fill="#ffffff" stroke="#0d47a1" stroke-width="3"/>
<text x="490" y="145" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0d47a1" font-weight="bold">روتر: hEX (RB750Gr3)</text>
<rect x="375" y="160" width="230" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
<text x="490" y="180" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">DHCP Server — interface=bridge</text>
<text x="490" y="197" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">pool 192.168.88.20-254</text>
<text x="490" y="214" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">network: gateway+DNS=192.168.88.1</text>
<rect x="375" y="230" width="230" height="70" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1"/>
<text x="490" y="250" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="normal">DNS Cache + static entries</text>
<text x="490" y="267" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="normal">nas.lan → 192.168.88.10</text>
<text x="490" y="284" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="normal">printer.lan → 192.168.88.11</text>
<rect x="30" y="160" width="180" height="60" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
<text x="120" y="186" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#455a64" font-weight="normal">اینترنت / upstream DNS</text>
<text x="120" y="205" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">8.8.8.8 / 1.1.1.1 (مثال)</text>
<rect x="340" y="100" width="300" height="240" rx="8" fill="none" stroke="#d32f2f" stroke-width="2"/>
<text x="490" y="355" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d32f2f" font-weight="normal">مرز مورداعتماد: 53 فقط از 192.168.88.0/24 — rule شمارنده‌دار (ضد open resolver)</text>
<line x1="740" y1="190" x2="660" y2="190" stroke="#1e88e5" stroke-width="3"/>
<text x="700" y="180" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1e88e5" font-weight="bold">① Discover</text>
<line x1="660" y1="215" x2="740" y2="215" stroke="#43a047" stroke-width="3"/>
<text x="700" y="231" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32" font-weight="bold">② Offer</text>
<text x="700" y="245" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2e7d32" font-weight="normal">آدرس+gateway+DNS</text>
<line x1="740" y1="265" x2="660" y2="265" stroke="#fb8c00" stroke-width="3"/>
<text x="700" y="260" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e65100" font-weight="bold">③ nas.lan؟ — پورت 53</text>
<line x1="660" y1="290" x2="740" y2="290" stroke="#43a047" stroke-width="3"/>
<text x="700" y="313" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32" font-weight="bold">④ پاسخ از cache/بالادستی</text>
<line x1="360" y1="190" x2="210" y2="190" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6,4"/>
<text x="285" y="182" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">forward/query بالادستی</text>
<rect x="680" y="22" width="230" height="78" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
<text x="795" y="44" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#616161" font-weight="normal">کلاینت غیرمورداعتماد</text>
<text x="795" y="64" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d32f2f" font-weight="normal">10.9.9.9 (gw=192.168.88.1)</text>
<text x="795" y="80" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d32f2f" font-weight="normal">drop شمارنده‌دار روی 53 (×)</text>
<text x="795" y="94" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#616161" font-weight="normal">کنترل مثبت: accept موقت کلاینت آزمایشی → پاسخ</text>
<line x1="710" y1="100" x2="640" y2="138" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,4"/>
<text x="600" y="118" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d32f2f" font-weight="bold">× timeout</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی، نه عکس از آزمایشگاه واقعی — منابع درس: دسترسی 2026-11-16</text>
</svg>
