<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار فازهای پذیرش تحویل درس N4 با نمونهٔ ماتریس</title>
<desc>چهار فاز پذیرش تحویل شبکه: اول معیارها از سود خود نوشته می‌شود و هر سرویس یک تست مثبت و یک تست منفی و یک شاهد دارد؛ دوم ماتریس تست به تست با ثبت خروجی اجرا می‌شود؛ سوم بستهٔ شواهد شامل خروجی دستورها و اندازه‌گیری‌ها و گزارش قبل و بعد ساخته می‌شود؛ چهارم امضای دو طرف فقط برای ردیف‌های تاییدشده. ردیف‌های قرمز به فاز اصلاح برمی‌گردند و اجرای مجدد همان ردیف لازم است. جدول پایین سه ردیف نمونه را نشان می‌دهد. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="60" y="80" width="210" height="96" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="165" y="106" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e88e5" font-weight="bold">۱. معیارها از SOW</text>
<text x="165" y="130" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">هر سرویس: تست مثبت + منفی</text>
<text x="165" y="146" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">+ شاهد — قبل از شروع</text>
<line x1="270" y1="128" x2="290" y2="128" stroke="#1e88e5" stroke-width="3"/>
<rect x="290" y="80" width="210" height="96" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
<text x="395" y="106" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#43a047" font-weight="bold">۲. اجرای ماتریس</text>
<text x="395" y="130" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">تست‌به‌تست با ثبت خروجی</text>
<text x="395" y="146" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">واقعی</text>
<line x1="500" y1="128" x2="520" y2="128" stroke="#43a047" stroke-width="3"/>
<rect x="520" y="80" width="210" height="96" rx="8" fill="#fafafa" stroke="#f9a825" stroke-width="2"/>
<text x="625" y="106" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f9a825" font-weight="bold">۳. شواهد</text>
<text x="625" y="130" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">خروجی دستورها +</text>
<text x="625" y="146" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">اندازه‌گیری‌ها + قبل/بعد</text>
<line x1="730" y1="128" x2="750" y2="128" stroke="#f9a825" stroke-width="3"/>
<rect x="750" y="80" width="210" height="96" rx="8" fill="#fafafa" stroke="#6a1b9a" stroke-width="2"/>
<text x="855" y="106" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6a1b9a" font-weight="bold">۴. امضای دو طرف</text>
<text x="855" y="130" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">فقط ردیف‌های ✓ با تاریخ</text>
<rect x="200" y="210" width="560" height="60" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="480" y="234" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d32f2f" font-weight="bold">ردیف ✗ → اصلاح → اجرای مجدد همان ردیف (+ ردیف‌های وابسته)</text>
<text x="480" y="256" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">پرش از اصلاح = ردیف skip می‌شود و پذیرفته حساب نمی‌آید</text>
<line x1="300" y1="210" x2="300" y2="190" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="700" y1="210" x2="700" y2="190" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,4"/>
<rect x="60" y="300" width="840" height="180" rx="8" fill="#fafafa" stroke="#b0bec5" stroke-width="2"/>
<text x="480" y="326" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#37474f" font-weight="bold">نمونهٔ ماتریس پذیرش (سه ردیف از جدول کامل درس)</text>
<text x="110" y="356" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">۱-۱ اینترنت</text>
<text x="320" y="356" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">ping 8.8.8.8 از دفتر</text>
<text x="560" y="356" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">reply</text>
<text x="830" y="356" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#43a047" font-weight="bold">✓</text>
<text x="110" y="390" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">۲-۱ جداسازی مهمان</text>
<text x="320" y="390" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">ping 192.168.10.1 از مهمان</text>
<text x="560" y="390" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">timeout + شمارندهٔ drop</text>
<text x="830" y="390" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#43a047" font-weight="bold">✓</text>
<text x="110" y="424" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">۲-۲ اینترنت مهمان</text>
<text x="320" y="424" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">بازکردن سایت از مهمان</text>
<text x="560" y="424" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">موفق</text>
<text x="830" y="424" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">✗ → فاز اصلاح</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — سناریو فرضی؛ اجرا NOT_RUN</text>
</svg>
