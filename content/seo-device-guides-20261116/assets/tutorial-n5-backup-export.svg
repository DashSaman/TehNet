<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار دو مسیر backup و export درس N5 با گیت بازیابی‌آزمون</title>
<desc>دو مسیر مکمل: مسیر اول فایل backup باینری رمزدار با کاربرد بازگشت سریع روی همان دستگاه و بازیابی از طریق دستور load روی دستگاه آزمایشی در آزمون فصلی. مسیر دوم فایل export متنی بدون مقادیر حساس برای حسابرسی و مقایسه و مهاجرت با هشدار UNKNOWN بین‌مدل. گیت بازیابی‌آزمون می‌گوید تا آزمون نشده پشتیبان آزموده حساب نمی‌شود. یک نسخه خارج از دستگاه نگهداری می‌شود چون خرابی دستگاه هر دو نسخه روی دستگاه را از بین می‌برد. این نمودار مفهومی و تألیفی TehNet است.</desc>
<text x="480" y="36" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">دو مسیر مکمل — نه جایگزین هم</text>
<rect x="80" y="90" width="380" height="210" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="270" y="116" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e88e5" font-weight="bold">مسیر ۱: backup باینری</text>
<text x="270" y="142" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">فایل کامل تنظیمات — سریع</text>
<text x="270" y="162" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">بازگشت روی همان دستگاه/نگارش</text>
<text x="270" y="184" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#455a64" font-weight="normal">با رمز محافظت شود</text>
<text x="270" y="206" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">هفتگی — Scheduler سندشده</text>
<rect x="140" y="232" width="260" height="48" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1"/>
<text x="270" y="252" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">بازیابی: /system backup load</text>
<text x="270" y="272" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">روی دستگاه آزمایشی فصلی</text>
<rect x="500" y="90" width="380" height="210" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
<text x="690" y="116" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">مسیر ۲: export متنی</text>
<text x="690" y="142" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">فایل خوانا — حسابرسی/مقایسه/مهاجرت</text>
<text x="690" y="162" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#455a64" font-weight="normal">بدون مقادیر حساس (این الگو)</text>
<text x="690" y="184" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">ماهانه + بعد از هر تغییر مهم</text>
<rect x="560" y="232" width="260" height="48" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1"/>
<text x="690" y="252" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="normal">مقایسه: diff دو export</text>
<text x="690" y="272" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">بین‌مدل = UNKNOWN — آزمون قبل از اتکا</text>
<rect x="200" y="350" width="560" height="64" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="480" y="374" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">گیت بازیابی‌آزمون (فصلی): load روی دستگاه آزمایشی + مقایسه</text>
<text x="480" y="398" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">تا آزمون نشده: «پشتیبانِ آزموده» حساب نمی‌شود — یا NOT_RUN ثبت</text>
<rect x="80" y="440" width="380" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="270" y="464" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e65100" font-weight="bold">یک نسخه خارج از دستگاه (مسیر مالک)</text>
<text x="270" y="484" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8d6e63" font-weight="normal">خرابی دستگاه = رفتن هر دو نسخه‌ی روی آن</text>
<rect x="500" y="440" width="380" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="690" y="464" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e65100" font-weight="bold">export متنی: بدون مقادیر حساس نگهداری شود</text>
<text x="690" y="484" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8d6e63" font-weight="normal">نسخهٔ شامل‌رمز ساخته نمی‌شود (این الگو)</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — دستورها RouterOS سندشده؛ اجرا NOT_RUN</text>
</svg>
