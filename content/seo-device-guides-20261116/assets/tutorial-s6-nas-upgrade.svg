<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<title>نمودار ارتقای NAS/سرور به 10G درس S6 با CRS309</title>
<desc>NAS و سرور با کابل DAC مستقیم به سوئیچ CRS309 که هشت پورت SFP+ ده گیگابیت دارد وصل شده‌اند. سوئیچ ظرفیت سوئیچینگ صد و شصت و دو گیگابیت و throughput هشتاد و یک گیگابیت دارد. سرعت قبل ارتقا صد و بیست و پنج مگابایت بر ثانیه و بعد ارتقا هزار و دویست و پنجاه مگابایت بر ثانیه است. تلهٔ بعدی دیسک است نه شبکه. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="60" y="80" width="200" height="100" rx="8" fill="#fafafa" stroke="#6a1b9a" stroke-width="3"/>
<text x="160" y="106" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6a1b9a" font-weight="bold">NAS (فرضی)</text>
<text x="160" y="130" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">پورت فعلی: 1G RJ45</text>
<text x="160" y="150" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">ارتقا: 10G SFP+ یا 2.5G RJ45</text>
<text x="160" y="170" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#78909c" font-weight="normal">(UNKNOWN تا برگهٔ NAS)</text>
<rect x="60" y="260" width="200" height="100" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="3"/>
<text x="160" y="286" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e88e5" font-weight="bold">سرور (فرضی)</text>
<text x="160" y="310" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">NIC third-party 10G SFP+</text>
<text x="160" y="330" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#78909c" font-weight="normal">(UNKNOWN تا برگهٔ سازنده)</text>
<text x="160" y="350" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">درایور نصب شود</text>
<rect x="430" y="130" width="260" height="230" rx="8" fill="#fafafa" stroke="#0d47a1" stroke-width="3"/>
<text x="560" y="158" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0d47a1" font-weight="bold">CRS309-1G-8S+IN</text>
<text x="560" y="180" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0d47a1" font-weight="normal">۸× SFP+ 10G</text>
<text x="560" y="200" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">۱× GbE مدیریت (PoE-in)</text>
<text x="560" y="226" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">switching: 162 Gbps</text>
<text x="560" y="246" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">non-blocking: 81 Gbps</text>
<text x="560" y="266" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">CPU: 98DX8208 ARM 800MHz</text>
<text x="560" y="286" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">RAM: 512 MB</text>
<text x="560" y="306" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">dual boot: RouterOS / SwitchOS</text>
<text x="560" y="330" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#90a4ae" font-weight="normal">(fetch 2026-11-17 از صفحهٔ رسمی)</text>
<line x1="260" y1="130" x2="430" y2="170" stroke="#43a047" stroke-width="4"/>
<text x="345" y="142" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32" font-weight="bold">DAC 1m/3m</text>
<line x1="260" y1="310" x2="430" y2="290" stroke="#1e88e5" stroke-width="4"/>
<text x="345" y="302" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0d47a1" font-weight="bold">DAC 3m</text>
<rect x="60" y="400" width="840" height="44" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
<text x="480" y="426" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="bold">قبل: 1G = 125 MB/s خام هر جهت → بعد: 10G = 1250 MB/s خام هر جهت (۱۰ برابر)</text>
<rect x="60" y="460" width="840" height="44" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="480" y="486" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e65100" font-weight="normal">bottleneck بعدی معمولاً دیسک NAS/سرور است نه شبکه — iperf3 جدا از دیسک سنجیده شود</text>
<text x="480" y="533" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — CRS309 از صفحهٔ رسمی mikrotik.com (دسترسی 2026-11-17)؛ اجرا NOT_RUN</text>
</svg>
