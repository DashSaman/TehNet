<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
<title>نمودار مسیر ترافیک HW در برابر CPU درس M4 با الزام‌های L3HW</title>
<desc>بسته ورودی اول بررسی می‌شود که آیا در هر دو پورت L3HW روشن است و مقصد پیشوند سندشده دارد؛ در این حالت سوییچ‌چیپ مسیریابی را در سخت‌افزار با سرعت سیم انجام می‌دهد. وگرنه بسته به CPU می‌رود که فایروال و NAT و مسیرهای باقی آنجا پردازش می‌شود. حافظه سخت‌افزار بین Fasttrack و ACL مشترک است و هر قانون ACL جای سه تا شش اتصال Fasttrack را می‌گیرد. شش الزام پیش از روشن‌کردن شامل فهرست مدل‌ها، روشن بودن هر دو پورت، پل vlan-filtering سخت‌افزاری، یک پل واحد، خاموش کردن موقت حین تغییرات لایه دو و نگارش حداقل ۷.۶ آمده است. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="60" y="60" width="180" height="70" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
<text x="150" y="90" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">بسته ورودی</text>
<text x="150" y="112" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#546e7a" font-weight="normal">پورت A — l3-hw-offloading=yes</text>
<rect x="330" y="55" width="240" height="80" rx="8" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
<text x="450" y="82" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6a1b9a" font-weight="bold">L3HW روشن در هر دو پورت؟</text>
<text x="450" y="102" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6a1b9a" font-weight="normal">مقصد prefix سندشده؟</text>
<line x1="240" y1="95" x2="330" y2="95" stroke="#37474f" stroke-width="3"/>
<line x1="570" y1="75" x2="700" y2="75" stroke="#43a047" stroke-width="4"/>
<text x="635" y="65" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="bold">بله</text>
<rect x="700" y="45" width="220" height="64" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="3"/>
<text x="810" y="68" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32" font-weight="bold">سوییچ‌چیپ — HW route</text>
<text x="810" y="88" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2e7d32" font-weight="normal">unicast · ECMP · VLAN (بدون CPU)</text>
<text x="810" y="102" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2e7d32" font-weight="normal">wire speed</text>
<line x1="570" y1="115" x2="700" y2="115" stroke="#ef6c00" stroke-width="4"/>
<text x="635" y="135" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e65100" font-weight="bold">خیر</text>
<rect x="700" y="125" width="220" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/>
<text x="810" y="148" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e65100" font-weight="bold">CPU</text>
<text x="810" y="168" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8d6e63" font-weight="normal">فایروال/NAT روی CPU</text>
<text x="810" y="186" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8d6e63" font-weight="normal">مالتی‌کست · interface-gateway اول</text>
<text x="810" y="204" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8d6e63" font-weight="normal">Fasttrack اتصال‌ها → HW آفلود</text>
<rect x="200" y="210" width="370" height="100" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="385" y="234" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d32f2f" font-weight="bold">حافظهٔ مشترک HW (سند رسمی)</text>
<text x="385" y="258" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">Fasttrack: 2.25K تا 4.5K اتصال (بسته به مدل)</text>
<text x="385" y="275" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">هر ACL = جای 3-6 اتصال Fasttrack</text>
<text x="385" y="292" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">توصیه: اول ACL سوییچی، بعد آفلود انتخابی</text>
<text x="385" y="309" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">آفلود جزئی: پیشوند بلندتر اول (/30، /29…)</text>
<text x="385" y="326" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#616161" font-weight="normal">98DX3236: 13,312 prefix · 8 nexthop · 4K ECMP</text>
<rect x="200" y="330" width="720" height="44" rx="8" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
<text x="560" y="356" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6a1b9a" font-weight="bold">انتخاب اجباری سند رسمی: یا مسیریابی سخت‌افزاری یا فایروال (فایروال روی CPU)</text>
<rect x="60" y="400" width="860" height="130" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
<text x="480" y="424" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0d47a1" font-weight="bold">الزام‌های سند رسمی قبل از روشن‌کردن</text>
<text x="90" y="448" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0d47a1" font-weight="normal">۱. فقط مدل‌های فهرست‌شده (98DX3xxx شامل 98DX3236=CRS326-24G-2S+RM؛ 98DX8xxx شامل CRS309/317/354)</text>
<text x="90" y="462" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0d47a1" font-weight="normal">۲. l3-hw-offloading=yes سراسری + هر دو پورت ورودی/خروجی</text>
<text x="90" y="476" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0d47a1" font-weight="normal">۳. پل hardware-offloaded با vlan-filtering — VLAN interface مستقیم روی switch port ممنوع</text>
<text x="90" y="490" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0d47a1" font-weight="normal">۴. فقط یک hardware bridge — چند پل = رفتار نامعین</text>
<text x="90" y="504" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0d47a1" font-weight="normal">۵. حین تغییرات L2 (پل/VLAN/MTU/MAC/bonding): L3HW موقتاً خاموش</text>
<text x="90" y="518" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0d47a1" font-weight="normal">۶. نگارش: منوی L3HW از v7.6 · مانیتور از v7.10 · آفلود per-VLAN از v7.21</text>
<text x="480" y="553" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — بر پایهٔ سند رسمی L3HW (دسترسی 2026-11-16)؛ اجرا NOT_RUN</text>
</svg>
