<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680">
<title>نمودار تصمیم انتخاب ماژول S3: DAC، مالتی‌مود یا تک‌مود بر پایهٔ فاصله</title>
<desc>فلوچارت تصمیم بر پایهٔ فاصلهٔ دو سر لینک: تا حدود سه متر همان رک کابل DAC بدون ماژول؛ تا حدود سیصد متر داخل ساختمان فیبر مالتی‌مود با ماژول S+85DLC03D با طول‌موج ۸۵۰ نانومتر؛ تا ده کیلومتر بین ساختمان‌ها فیبر تک‌مود با ماژول S+31DLC10D با طول‌موج ۱۳۱۰ نانومتر و استاندارد 10GBASE-LR. کنار نمودار قواعد سازگاری سندشده آمده: ماژول 1G در پورت SFP+ با تنظیم اجباری سرعت و استثناهای سخت‌افزاری، rate-select برای 25G، سقف ماژول S+RJ10 روی CRS309 و وضعیت UNKNOWN ماژول‌های غیرمیکروتیک. این نمودار مفهومی و تألیفی TehNet است.</desc>
<text x="480" y="36" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">فاصلهٔ دو سر لینک؟</text>
<rect x="360" y="104" width="500" height="92" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="610" y="124" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e88e5" font-weight="bold">تا ~۳ متر — همان رک</text>
<text x="610" y="146" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">کابل DAC — S+DA0001 (1m) — Discontinued</text>
<text x="610" y="166" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">جایگزین رسمی: DAC 3m (جدول سازگاری)  |  بدون ماژول — کابل مستقیم</text>
<rect x="360" y="304" width="500" height="92" rx="8" fill="#fafafa" stroke="#fb8c00" stroke-width="2"/>
<text x="610" y="324" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fb8c00" font-weight="bold">تا ~۳۰۰ متر — داخل ساختمان</text>
<text x="610" y="346" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">فیبر مالتی‌مود (OM3) — ماژول: S+85DLC03D</text>
<text x="610" y="366" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">850nm — LC — دو سر لینک  |  2x $59</text>
<rect x="360" y="504" width="500" height="92" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
<text x="610" y="524" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#43a047" font-weight="bold">تا ~۱۰ کیلومتر — بین ساختمان‌ها</text>
<text x="610" y="546" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="normal">فیبر تک‌مود (OS2) — ماژول: S+31DLC10D</text>
<text x="610" y="566" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#546e7a" font-weight="normal">1310nm — 10GBASE-LR — دو سر لینک  |  2x $69</text>
<line x1="480" y1="48" x2="480" y2="104" stroke="#37474f" stroke-width="2"/>
<line x1="480" y1="104" x2="250" y2="104" stroke="#37474f" stroke-width="2"/>
<line x1="250" y1="104" x2="250" y2="104" stroke="#37474f" stroke-width="2"/>
<line x1="480" y1="104" x2="610" y2="104" stroke="#37474f" stroke-width="2"/>
<line x1="250" y1="104" x2="250" y2="160" stroke="#37474f" stroke-width="2"/>
<line x1="610" y1="104" x2="610" y2="304" stroke="#37474f" stroke-width="2"/>
<line x1="480" y1="104" x2="480" y2="412" stroke="#37474f" stroke-width="2"/>
<text x="240" y="128" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e88e5" font-weight="bold">①</text>
<text x="620" y="128" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="normal"></text>
<text x="700" y="328" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#43a047" font-weight="bold">③</text>
<rect x="30" y="190" width="300" height="150" rx="8" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
<text x="180" y="214" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6a1b9a" font-weight="bold">قواعد سازگاری (سند رسمی)</text>
<text x="180" y="238" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#455a64" font-weight="normal">1G در SFP+ با استثنا و speed اجباری</text>
<text x="180" y="255" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#455a64" font-weight="normal">(CCR1016 SFP+1 فقط 10G)</text>
<text x="180" y="272" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#455a64" font-weight="normal">25G: sfp-rate-select=low</text>
<text x="180" y="289" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#455a64" font-weight="normal">S+RJ10: CRS309 حداکثر 4 ماژول</text>
<text x="180" y="306" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#455a64" font-weight="normal">third-party: MSA باید سازگار باشد</text>
<text x="180" y="323" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#455a64" font-weight="normal">— ولی تضمین کامل نمی‌شود (UNKNOWN)</text>
<text x="610" y="62" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fb8c00" font-weight="bold">②</text>
<text x="480" y="652" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — ماژول‌ها از صفحات رسمی mikrotik.com (دسترسی 2026-11-16)</text>
</svg>
