<text x="560" y="494" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">کاربر تأیید + قبل/بعد (الگوی N4)</text>
<text x="160" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<line x1="480" y1="532" x2="480" y2="552" stroke="#37474f" stroke-width="2"/>
<rect x="140" y="552" width="680" height="62" rx="8" fill="#fafafa" stroke="#78909c" stroke-width="2"/>
<text x="190" y="576" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#78909c" font-weight="bold">۷. گزارش رخداد</text>
<text x="560" y="576" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">توالی زمان‌ها · ریشه · استثنا</text>
<text x="160" y="596" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<rect x="20" y="200" width="110" height="150" rx="8" fill="#fdecea" stroke="#d32f2f" stroke-width="2"/>
<text x="75" y="224" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d32f2f" font-weight="bold">معیار تشدید</text>
<text x="75" y="246" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">جدی: 30 دقیقه</text>
<text x="75" y="264" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">بدون پیشرفت</text>
<text x="75" y="282" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">دو تلاش بی‌نتیجه</text>
<text x="75" y="300" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">روی یک فرضیه</text>
<line x1="140" y1="290" x2="130" y2="275" stroke="#d32f2f" stroke-width="2" stroke-dasharray="4,3"/>
<rect x="830" y="200" width="110" height="160" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="885" y="224" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e65100" font-weight="bold">استثناها</text>
<text x="885" y="246" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">قطعی ISP</text>
<text x="885" y="264" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">تأمین قطعه</text>
<text x="885" y="282" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">سخت‌افزار مشتری</text>
<text x="885" y="300" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">ساعت‌شمار</text>
<text x="885" y="318" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#455a64" font-weight="normal">با توافق (N3)</text>
<text x="480" y="633" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی — زمان‌ها فرض آموزشی؛ هر سازمان مالکِ تعیین اعداد خودش است؛ اجرا NOT_RUN</text>
</svg>
