<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660">
<title>نمودار مسیر رخداد درس N6: هفت مرحله از ثبت تا گزارش با تشدید و استثناها</title>
<desc>مسیر هفت‌مرحله‌ای رخداد: ثبت با زمان و دامنه و اثر؛ تریاژ با معیار از پیش‌نوشته؛ اقدام اولیه با نردبان درس N1؛ تشدید در صورت معیار با handoff کامل شامل چه کاری انجام شده دیده شده و نشده؛ اقدام سطح دو؛ تأیید کاربر و بستن با ثبت قبل و بعد؛ و گزارش نهایی ریشه و استثنا. جعبه‌های کناری معیار تشدید و سه استثنا با رفتار ساعت‌شمار را نشان می‌دهند. زمان‌ها فرض آموزشی‌اند و هر سازمان مالک تعیین اعداد خودش است. این نمودار مفهومی و تألیفی TehNet است.</desc>
<rect x="140" y="60" width="680" height="62" rx="8" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
<text x="190" y="84" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e88e5" font-weight="bold">۱. ثبت رخداد</text>
<text x="560" y="84" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">زمان · دامنه · اثر کسب‌وکاری</text>
<text x="160" y="104" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<line x1="480" y1="122" x2="480" y2="142" stroke="#37474f" stroke-width="2"/>
<rect x="140" y="142" width="680" height="62" rx="8" fill="#fafafa" stroke="#6a1b9a" stroke-width="2"/>
<text x="190" y="166" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6a1b9a" font-weight="bold">۲. تریاژ</text>
<text x="560" y="166" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">جدی/عادی با معیار از پیش‌نوشته</text>
<text x="160" y="186" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<line x1="480" y1="204" x2="480" y2="224" stroke="#37474f" stroke-width="2"/>
<rect x="140" y="224" width="680" height="62" rx="8" fill="#fafafa" stroke="#fb8c00" stroke-width="2"/>
<text x="190" y="248" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fb8c00" font-weight="bold">۳. اقدام اولیه</text>
<text x="560" y="248" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">نردبان N1 — یافته‌ها ثبت</text>
<text x="160" y="268" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<line x1="480" y1="286" x2="480" y2="306" stroke="#37474f" stroke-width="2"/>
<rect x="140" y="306" width="680" height="62" rx="8" fill="#fafafa" stroke="#d32f2f" stroke-width="2"/>
<text x="190" y="330" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">۴. تشدید (در صورت معیار)</text>
<text x="560" y="330" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">handoff کامل: کردم/دیدم/نکردم + اثر + زمان‌ها</text>
<text x="160" y="350" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<line x1="480" y1="368" x2="480" y2="388" stroke="#37474f" stroke-width="2"/>
<rect x="140" y="388" width="680" height="62" rx="8" fill="#fafafa" stroke="#f9a825" stroke-width="2"/>
<text x="190" y="412" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f9a825" font-weight="bold">۵. اقدام سطح دو</text>
<text x="560" y="412" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#37474f" font-weight="normal">ادامه با ثبت تغییرات</text>
<text x="160" y="432" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="8" text-anchor="start" fill="#90a4ae" font-weight="normal">فرض آموزشی</text>
<line x1="480" y1="450" x2="480" y2="470" stroke="#37474f" stroke-width="2"/>
<rect x="140" y="470" width="680" height="62" rx="8" fill="#fafafa" stroke="#43a047" stroke-width="2"/>
