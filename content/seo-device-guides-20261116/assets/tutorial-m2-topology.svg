<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
<title>نمودار توپولوژی درس M2: روتر hEX و سوئیچ CRS112 با چهار VLAN</title>
<desc>اینترنت به ether1 روتر hEX (WAN) می‌رسد. از ether2 روتر تا ether1 سوئیچ CRS112 یک لینک trunk تگ‌دار برای VLANهای 10 و 20 و 30 و 40 کشیده شده. سوئیچ چهار پورت access دارد: ether2 به لپ‌تاپ دفتر در VLAN10، ether3 به DVR با آدرس 192.168.20.10 و دوربین‌ها در VLAN20، ether4 به تلفن IP در VLAN30، ether5 به نقطهٔ دسترسی مهمان در VLAN40. راهنمای رنگ‌ها پایین تصویر است. این نمودار مفهومی و تألیفی TehNet است و از آزمایشگاه واقعی گرفته نشده است.</desc>
<rect x="340" y="20" width="280" height="60" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
<text x="480" y="45" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">اینترنت (فرضی آموزشی)</text>
<line x1="480" y1="80" x2="480" y2="110" stroke="#37474f" stroke-width="3"/>
<text x="500" y="100" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">ether1 = WAN</text>
<rect x="340" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#0d47a1" stroke-width="3"/>
<text x="480" y="138" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#0d47a1" font-weight="bold">روتر: hEX (RB750Gr3)</text>
<text x="480" y="160" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="normal">VLAN interfaceها + فایروال + NAT</text>
<text x="480" y="180" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#546e7a" font-weight="normal">RouterOS v7.16+ (مبنای سند)</text>
<line x1="430" y1="200" x2="430" y2="300" stroke="#37474f" stroke-width="4"/>
<line x1="438" y1="200" x2="438" y2="300" stroke="#37474f" stroke-width="4"/>
<text x="450" y="255" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#37474f" font-weight="bold">trunk — تگ‌دار 10,20,30,40</text>
<rect x="280" y="300" width="400" height="80" rx="8" fill="#ffffff" stroke="#6a1b9a" stroke-width="3"/>
<text x="480" y="328" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#6a1b9a" font-weight="bold">سوئیچ: CRS112-8P-4S-IN</text>
<text x="480" y="350" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#546e7a" font-weight="normal">bridge1 — vlan-filtering (آخرین گام)</text>
<line x1="320" y1="380" x2="320" y2="430" stroke="#1e88e5" stroke-width="3"/>
<text x="326" y="400" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e88e5" font-weight="bold">ether2 → ACC-10</text>
<rect x="274" y="430" width="92" height="52" rx="8" fill="#1e88e522" stroke="#1e88e5" stroke-width="2"/>
<text x="320" y="446" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal">لپ‌تاپ دفتر (VLAN10)</text>
<line x1="420" y1="380" x2="420" y2="430" stroke="#fb8c00" stroke-width="3"/>
<text x="426" y="400" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#fb8c00" font-weight="bold">ether3 → ACC-20</text>
<rect x="374" y="430" width="92" height="52" rx="8" fill="#fb8c0022" stroke="#fb8c00" stroke-width="2"/>
<text x="420" y="446" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal">DVR 192.168.20.10 +</text>
<text x="420" y="458" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal">دوربین‌ها (VLAN20)</text>
<line x1="520" y1="380" x2="520" y2="430" stroke="#43a047" stroke-width="3"/>
<text x="526" y="400" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#43a047" font-weight="bold">ether4 → ACC-30</text>
<rect x="474" y="430" width="92" height="52" rx="8" fill="#43a04722" stroke="#43a047" stroke-width="2"/>
<text x="520" y="446" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal">تلفن IP (VLAN30)</text>
<line x1="620" y1="380" x2="620" y2="430" stroke="#8d6e63" stroke-width="3"/>
<text x="626" y="400" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="start" fill="#8d6e63" font-weight="bold">ether5 → ACC-40</text>
<rect x="574" y="430" width="92" height="52" rx="8" fill="#8d6e6322" stroke="#8d6e63" stroke-width="2"/>
<text x="620" y="446" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a1a1a" font-weight="normal">AP مهمان (VLAN40)</text>
<rect x="40" y="488" width="880" height="48" rx="8" fill="#fafafa" stroke="#b0bec5" stroke-width="1"/>
<text x="60" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#37474f" font-weight="bold">راهنما:</text>
<rect x="120" y="502" width="14" height="14" rx="8" fill="#1e88e5" stroke="#37474f" stroke-width="2"/>
<text x="140" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">VLAN10 دفتر</text>
<rect x="230" y="502" width="14" height="14" rx="8" fill="#fb8c00" stroke="#37474f" stroke-width="2"/>
<text x="250" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">VLAN20 دوربین/DVR</text>
<rect x="390" y="502" width="14" height="14" rx="8" fill="#43a047" stroke="#37474f" stroke-width="2"/>
<text x="410" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">VLAN30 تلفن</text>
<rect x="510" y="502" width="14" height="14" rx="8" fill="#8d6e63" stroke="#37474f" stroke-width="2"/>
<text x="530" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">VLAN40 مهمان</text>
<line x1="640" y1="509" x2="680" y2="509" stroke="#37474f" stroke-width="4"/>
<line x1="640" y1="513" x2="680" y2="513" stroke="#37474f" stroke-width="4"/>
<text x="688" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">trunk (تگ‌دار)</text>
<line x1="800" y1="509" x2="840" y2="509" stroke="#37474f" stroke-width="2"/>
<text x="846" y="514" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">access</text>
<text x="480" y="566" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#78909c" font-weight="normal">نمودار مفهومی تألیفی TehNet — نه عکس واقعی، نه عکس از آزمایشگاه واقعی — منابع درس: دسترسی 2026-11-16</text>
</svg>
