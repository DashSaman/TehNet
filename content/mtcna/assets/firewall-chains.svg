<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52716d"/></marker><style>text{font-family:DejaVu Sans,sans-serif;fill:#153c36}.node{font-size:23px;font-weight:bold}.sub{font-size:21px}.edge{font-size:21px;paint-order:stroke;stroke:#f3f5ef;stroke-width:8;stroke-linejoin:round}</style></defs><rect width="1600" height="980" fill="#f3f5ef"/><text x="80" y="58" font-size="28" font-weight="bold">Choose the chain by the packet destination</text><g transform="translate(0,65)"><path d="M600,225 L560,375" stroke="#52716d" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="580" y="286" text-anchor="middle" class="edge">Local destination</text><path d="M960,225 L1000,375" stroke="#52716d" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="980" y="286" text-anchor="middle" class="edge">Routed destination</text><g transform="translate(600,90)"><rect width="360" height="140" rx="16" fill="#fff" stroke="#2b5b55" stroke-width="3"/><text x="180" y="40" text-anchor="middle" class="node">Packet arrives</text><text x="180" y="76" text-anchor="middle" class="sub">Inspect actual destination</text></g><g transform="translate(200,380)"><rect width="360" height="140" rx="16" fill="#fff" stroke="#2b5b55" stroke-width="3"/><text x="180" y="40" text-anchor="middle" class="node">Router itself</text><text x="180" y="76" text-anchor="middle" class="sub">input chain</text><text x="180" y="103" text-anchor="middle" class="sub">Management / DNS services</text></g><g transform="translate(1000,380)"><rect width="360" height="140" rx="16" fill="#fff" stroke="#2b5b55" stroke-width="3"/><text x="180" y="40" text-anchor="middle" class="node">Another host</text><text x="180" y="76" text-anchor="middle" class="sub">forward chain</text><text x="180" y="103" text-anchor="middle" class="sub">Transit traffic</text></g><g transform="translate(600,650)"><rect width="360" height="140" rx="16" fill="#fff" stroke="#2b5b55" stroke-width="3"/><text x="180" y="40" text-anchor="middle" class="node">Router-generated traffic</text><text x="180" y="76" text-anchor="middle" class="sub">output chain</text><text x="180" y="103" text-anchor="middle" class="sub">Router ping / DNS queries</text></g></g><text x="80" y="944" font-size="20" fill="#52716d">TehNet / Tehran Network · MTCNA · Technical diagram, not a screenshot or test result</text></svg>