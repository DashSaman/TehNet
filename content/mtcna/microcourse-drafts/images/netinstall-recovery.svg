<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RouterOS recovery: choose the least disruptive action</title><desc id="desc">Reset and Netinstall are not the same operation</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10" fill="#1a9bb0"/></marker></defs><rect width="1600" height="900" fill="#f4f8fc"/><rect x="50" y="45" width="1500" height="810" rx="35" fill="#fff" stroke="#d7e7ee" stroke-width="2"/><rect x="50" y="45" width="1500" height="14" rx="7" fill="#1a9bb0"/><text x="800" y="130" font-size="39" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700" fill="#143b5a">RouterOS recovery: choose the least disruptive action</text><text x="800" y="180" font-size="22" font-family="DejaVu Sans,sans-serif" text-anchor="middle" fill="#537389">Reset and Netinstall are not the same operation</text><path d="M 420 335 L 467 335" fill="none" stroke="#1a9bb0" stroke-width="5" marker-end="url(#arrow)"/><path d="M 765 335 L 812 335" fill="none" stroke="#1a9bb0" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1110 335 L 1157 335" fill="none" stroke="#1a9bb0" stroke-width="5" marker-end="url(#arrow)"/><path d="M 892 458 L 955 353" fill="none" stroke="#1a9bb0" stroke-width="5" marker-end="url(#arrow)"/><rect x="130" y="255" width="290" height="160" rx="18" fill="#e5f7fb" stroke="#3bacc2" stroke-width="2"/><text x="275" y="300" font-family="DejaVu Sans,sans-serif" fill="#123c5b" text-anchor="middle" font-weight="700" font-size="24">No IP access?</text><text x="275" y="336" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Check cable / route</text><text x="275" y="365" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Try isolated console</text><rect x="475" y="255" width="290" height="160" rx="18" fill="#e5f7fb" stroke="#3bacc2" stroke-width="2"/><text x="620" y="300" font-family="DejaVu Sans,sans-serif" fill="#123c5b" text-anchor="middle" font-weight="700" font-size="24">Change rollback</text><text x="620" y="336" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Safe Mode / undo</text><text x="620" y="365" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Preserve configuration</text><rect x="820" y="255" width="290" height="160" rx="18" fill="#e5f7fb" stroke="#3bacc2" stroke-width="2"/><text x="965" y="300" font-family="DejaVu Sans,sans-serif" fill="#123c5b" text-anchor="middle" font-weight="700" font-size="24">Reset?</text><text x="965" y="336" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Requires local backup</text><text x="965" y="365" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">May clear DHCP/firewall</text><rect x="1165" y="255" width="290" height="160" rx="18" fill="#e5f7fb" stroke="#3bacc2" stroke-width="2"/><text x="1310" y="300" font-family="DejaVu Sans,sans-serif" fill="#123c5b" text-anchor="middle" font-weight="700" font-size="24">Netinstall</text><text x="1310" y="336" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">RouterBOARD recovery</text><text x="1310" y="365" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Disk data can be lost</text><rect x="355" y="540" width="900" height="130" rx="18" fill="#e5f7fb" stroke="#3bacc2" stroke-width="2"/><text x="805" y="585" font-family="DejaVu Sans,sans-serif" fill="#123c5b" text-anchor="middle" font-weight="700" font-size="24">Every recovery needs an acceptance test</text><text x="805" y="621" font-family="DejaVu Sans,sans-serif" fill="#3c6378" text-anchor="middle" font-size="19">Management IP  •  Routes  •  DHCP  •  Firewall  •  Restore evidence</text><rect x="80" y="766" width="1440" height="1" fill="#d7e7ee"/><text x="95" y="808" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#31546b">Do not run destructive recovery on customer or production devices without authorization and tested backups.</text><text x="1505" y="842" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="end" fill="#658196">TehNet / Tehran Network • conceptual diagram • not a RouterOS screenshot</text></svg>