name: Public repository guard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tracked-file-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified2026-10-31
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_publication_guard.py -v
      - run: python3 tools/publication_guard.py
