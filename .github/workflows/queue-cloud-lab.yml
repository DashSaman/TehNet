name: Isolated Queue cloud lab
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/queue-cloud-lab.yml'
      - 'tools/cloud-queue/**'
permissions:
  contents: read
concurrency:
  group: queue-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  queue-lab:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'DashSaman/TehNet' && github.event.repository.private == false && (github.ref == 'refs/heads/lab/cloud-queue-20261108' || github.head_ref == 'lab/cloud-queue-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Public-file guard
        run: python3 tools/publication_guard.py
      - name: Console and Queue value regression tests
        run: python3 -m unittest discover -s tests -p 'cloud_queue_*_test.py' -v
      - name: Install isolated test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xvfb xdotool python3-paramiko python3-pil unzip libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-cursor0 libxkbcommon-x11-0 libegl1
      - name: Verify remote executor
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          qemu-system-x86_64 --version | head -1
          Xvfb -help 2>&1 | head -3 || true
          python3 -c "import paramiko; from PIL import Image; print('CLOUD_PREREQUISITES_READY')"
      - name: Run actual lab when its reviewed source is present
        run: |
          if test -f tools/cloud-queue/lab.py; then
            python3 tools/cloud-queue/lab.py
          else
            echo 'BOOTSTRAP_ONLY; no Queue acceptance or screenshots yet'
          fi

  queue-wordpress:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'DashSaman/TehNet' && github.event.repository.private == false && github.head_ref == 'lab/cloud-queue-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TN_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TN_BASE_CSS_SHA256: 3d70851009859205b81e0ff7b6ee9743553a4ab6fa226b93d2a376bb2b8296cf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Public-file guard
        run: python3 tools/publication_guard.py
      - name: Queue package boundary and original-byte checks
        run: python3 -m unittest discover -s tests -p 'cloud_queue_*_test.py' -v
      - name: Closed synthetic WordPress qualification
        run: |
          sudo env "PATH=$PATH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" TN_SOURCE_SHA="$TN_SOURCE_SHA" TN_BASE_CSS_SHA256="$TN_BASE_CSS_SHA256" python3 tools/cloud-queue/staging.py
