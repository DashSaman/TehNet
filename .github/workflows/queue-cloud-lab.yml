name: Isolated Queue cloud lab
on:
  push:
    branches: [lab/cloud-queue-20261108]
    paths:
      - '.github/workflows/queue-cloud-lab.yml'
      - 'tools/cloud-queue/lab.py'
      - 'tools/cloud-queue/prompt_state.py'
      - 'tools/cloud-queue/queue_values.py'
      - 'tests/cloud_queue_terminal_test.py'
      - 'tests/cloud_queue_values_test.py'
permissions:
  contents: read
concurrency:
  group: queue-cloud-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  queue-lab:
    if: github.repository == 'DashSaman/TehNet' && github.event.repository.private == false && github.ref == 'refs/heads/lab/cloud-queue-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Public-file guard
        run: python3 tools/publication_guard.py
      - name: Console and limit regression tests
        run: python3 -m unittest discover -s tests -p 'cloud_queue_[tv]*_test.py' -v
      - name: Install isolated lab prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xvfb xdotool python3-paramiko python3-pil unzip libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-cursor0 libxkbcommon-x11-0 libegl1
      - name: Actual cloud CHR and WinBox acceptance
        run: python3 tools/cloud-queue/lab.py
