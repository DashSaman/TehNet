services:
  configurator:
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/tehnet_erp
    volumes:
      - ../../integrations/tehnet_erp:/home/frappe/frappe-bench/apps/tehnet_erp:ro
  backend:
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/tehnet_erp
      TEHNET_SANDBOX: "1"
