# Replace __PHP_FPM_SOCK__ during deployment after detecting the actual socket.
server {
    listen 80;
    listen [::]:80;
    server_name www.tehnet.ir;
    return 301 https://tehnet.ir$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name tehnet.ir;
    root /var/www/tehnet;
    index index.php index.html;
    client_max_body_size 128m;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
    }
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location ~ /\. { deny all; }
}
