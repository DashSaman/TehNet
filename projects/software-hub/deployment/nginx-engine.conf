location = /software { access_log off; error_log /dev/null crit; return 308 /software/; }
location ^~ /software/ {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 4k;
    proxy_read_timeout 15s;
}
