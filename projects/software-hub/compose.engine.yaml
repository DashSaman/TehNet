services:
  app:
    image: ${TEHNET_SOFTWARE_IMAGE:?exact locally loaded image reference required}
    container_name: tehnet-software
    restart: unless-stopped
    ports: ["127.0.0.1:18083:8000"]
    environment:
      TEHNET_SOFTWARE_DATA: /data
      TEHNET_SOFTWARE_METADATA: /metadata
      TEHNET_SOFTWARE_AUTH: /auth
      TEHNET_SOFTWARE_RESTRICTED: "1"
      TEHNET_SOFTWARE_ORIGIN: https://tehnet.ir
      TEHNET_SOFTWARE_OFFLINE_PUBLIC: /offline-public
      TEHNET_SOFTWARE_PROVIDER_RECEIPTS: /metadata/public/provider-qualification.json
    volumes:
      - /srv/tehnet-software/data:/data:ro
      - /srv/tehnet-software/metadata:/metadata:ro
      - /srv/tehnet-software/auth:/auth:rw
      - /opt/tehnet-software/public:/offline-public:ro
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    networks: [software]
networks:
  software:
    driver: bridge
